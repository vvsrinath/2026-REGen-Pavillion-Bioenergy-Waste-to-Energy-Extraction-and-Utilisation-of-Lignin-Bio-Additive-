<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Netlify form definitions</title>
  </head>
  <body>
    <!--
      This file exists only so Netlify can detect the collaboration form at deploy
      time. The visible form is rendered by React. Keep the field names in sync
      with src/components/Collaboration.jsx.
    -->
    <form name="collaboration" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="collaboration" />
      <input type="text" name="name" />
      <input type="text" name="institution" />
      <input type="email" name="email" />
      <input type="text" name="interest" />
      <textarea name="message"></textarea>
      <input type="checkbox" name="consent" />
      <input type="text" name="bot-field" />
    </form>
  </body>
</html>
