<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#143d2b">
<title>Page not found | Lignin Bio-Additive Research</title>
<link rel="icon" href="/assets/favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<style>
:root{--forest:#143d2b;--green:#1d7049;--mint:#eaf4ed;--gold:#d9a441;--ink:#172820;--muted:#637269;--line:#dfe8e1}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:28px;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:radial-gradient(ellipse at 90% 10%,#e7f4e9 0,transparent 35%),linear-gradient(135deg,#f7faf6 0%,#fff 65%,#fff8e9 100%)}
.card{width:min(560px,100%);background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:0 16px 45px rgba(20,61,43,.08);padding:42px;text-align:center}
.mark{display:grid;place-items:center;width:56px;height:56px;margin:0 auto 18px;border-radius:16px;background:var(--forest);color:#fff;font-size:1.6rem;font-weight:800}
.code{font-size:.78rem;letter-spacing:.16em;text-transform:uppercase;color:var(--green);font-weight:800}
h1{font-size:clamp(1.7rem,5vw,2.4rem);letter-spacing:-.03em;margin:10px 0 12px;line-height:1.1}
p{color:var(--muted);margin:0 0 26px}
.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn{border-radius:10px;padding:12px 18px;text-decoration:none;font-weight:700;font-size:.93rem}
.primary{background:var(--forest);color:#fff}
.secondary{border:1px solid #cbd9cf;color:var(--forest)}
.btn:hover{opacity:.92}
</style>
</head>
<body>
<main class="card">
  <div class="mark" aria-hidden="true">L</div>
  <div class="code">Error 404</div>
  <h1>This page could not be found</h1>
  <p>The page you requested does not exist or may have moved. Return to the research project website below.</p>
  <div class="actions">
    <a class="btn primary" href="/">Back to home</a>
    <a class="btn secondary" href="/#references">View references</a>
  </div>
</main>
</body>
</html>
